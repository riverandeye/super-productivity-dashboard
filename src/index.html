          var badge;
          if (st === 'done') badge = '✓ ' + t('TASK_DONE');
          else if (st === 'behind') badge = t('BEHIND', { n: r.dueBefore - r.datedDone });
          else if (st === 'upcoming') badge = r.planStart != null ? t('STARTS_IN', { n: r.planStart - model.today }) : t('TASKS_UPCOMING');
          else badge = r.planEnd != null && r.planEnd >= model.today ? t('D_DAY', { n: r.planEnd - model.today }) : t('TASKS_ACTIVE');
          h += '<span class="tt-badge">' + esc(badge) + '</span>';
          // one pip per subtask, in planned order
          h += '<div class="tt-pips' + (r.items.length > 24 ? ' dense' : '') + '">';
          r.items.forEach(function (it) {
            var k = 'p' + ++uid;
            pipData[k] = it;
            var c = it.done ? 'done' : it.plan != null && it.plan < model.today ? 'missed' : it.plan === model.today ? 'now' : 'todo';
            h += '<span class="pip ' + c + '" data-pip="' + k + '"></span>';
          });
          h += '</div></div>';
          return h;
        }

        // ---------- today ----------
        function itemDone(l) {
          return l.id in pending ? pending[l.id] : l.done;
        }
        function renderToday() {
          var p = cur;
          var items = p.todayItems;
          var total = items.length;
          var doneN = items.filter(itemDone).length;
          var ratio = total ? doneN / total : 0;
          var html = '<div class="today-head">';
          html += '<div class="mini-ring"><svg viewBox="0 0 52 52">' + ringParts({ cx: 26, cy: 26, r: 21, w: 6, ratio: ratio, p: { c: C.c, c2: C.c2, soft: 'var(--track)' }, key: 'todayRing' }) + '</svg><b>' + doneN + '/' + total + '</b></div>';
          html += '<div><h2>' + esc(t('TODAY')) + '</h2><div class="date">' + esc(dfmt({ weekday: 'short', month: 'short', day: 'numeric' }, model.today)) + '</div></div>';
          html += '<div class="today-pts"><div class="v grad-text">+' + counter('todayPts2', p.gainedPts, 2) + (lang === 'ko' ? '%p' : ' pts') + '</div>' + (p.todayGainPts + p.gainedPts > 0 ? '<div class="l">' + esc(t('OF_TODAY', { n: t('PTS', { n: pts(p.todayGainPts + p.gainedPts) }) })) + '</div>' : '') + '</div>';
          html += '</div>';
          if (!total) {
            html += '<div class="empty"><span class="big">🌤️</span>' + esc(t('TODAY_EMPTY')) + '</div>';
          } else {
            if (doneN === total) html += '<div class="alldone">🎉 ' + esc(t('TODAY_ALL_DONE')) + '</div>';
            html += '<ul class="tlist">' + items.map(function (l) {
              return itemHtml(l, false);
            }).join('') + '</ul>';
          }
          if (p.overdue.length) {
            html += '<div class="sub-head">' + esc(t('OVERDUE')) + '<span>' + esc(t('OVERDUE_COUNT', { n: p.overdue.length })) + '</span></div>';
            var shown = ui.showAllOverdue ? p.overdue.slice(0, 100) : p.overdue.slice(0, 5);
            html += '<ul class="tlist">' + shown.map(function (l) {
              return itemHtml(l, true);
            }).join('') + '</ul>';
            if (p.overdue.length > 5) html += '<button class="more" id="moreOverdue">' + esc(ui.showAllOverdue ? t('SHOW_LESS') : t('SHOW_MORE', { n: p.overdue.length - 5 })) + '</button>';
          }
          var card = $('todayCard');
          card.innerHTML = html;
          card.querySelectorAll('[data-check]').forEach(function (btn) {
            btn.addEventListener('click', onCheck);
          });
          var more = card.querySelector('#moreOverdue');
          if (more)
            more.addEventListener('click', function () {
              ui.showAllOverdue = !ui.showAllOverdue;
              renderToday();
              runArcs(card);
              runCounters(card);
            });
          card.querySelectorAll('[data-open]').forEach(function (el) {
            el.addEventListener('click', function () {
              if (typeof PluginAPI.selectTask === 'function') PluginAPI.selectTask(el.getAttribute('data-open')).catch(function () {});
            });
          });
          justChecked = {};
        }
        function itemHtml(l, late) {
          var done = itemDone(l);
          var ptsVal = cur.total ? 100 / cur.total : 0;
          var cls = 'titem' + (done ? ' done' : '') + (justChecked[l.id] ? ' just' : '');
          var h = '<li class="' + cls + '"><span class="sweep"></span>';
          h +=
            '<button class="check' + (done ? ' on' : '') + '" data-check="' + esc(l.id) + '" data-done="' + (done ? 1 : 0) + '"' + (l.id in pending ? ' disabled' : '') +
            ' title="' + esc(t(done ? 'MARK_UNDONE' : 'MARK_DONE')) + '" aria-label="' + esc(t(done ? 'MARK_UNDONE' : 'MARK_DONE')) + '"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>';
          h += '<div class="tmain"><div class="ttitle" data-open="' + esc(l.id) + '" title="' + esc(t('OPEN_TASK')) + '">' + esc(l.title || t('UNTITLED')) + '</div>';
          var subParts = [];
          if (l.parentTitle) subParts.push(esc(l.parentTitle));
          if (l.plan !== model.today && !late && done) subParts.push(esc(t('CHECKED_OFF_PLAN')));
          h += '<div class="tsub">' + (subParts.length ? '<span class="pdot"></span>' + subParts.join(' · ') : '') + '</div></div>';
          h += late ? '<span class="tpts late">' + esc(fmtShort(l.plan)) + '</span>' : '<span class="tpts">+' + esc(t('PTS', { n: pts(ptsVal) })) + '</span>';
          h += '</li>';
          return h;
        }
        async function onCheck(e) {
          var btn = e.currentTarget;
          var id = btn.getAttribute('data-check');
          var toDone = btn.getAttribute('data-done') !== '1';
          pending[id] = toDone;
          if (toDone) {
            justChecked[id] = true;
            var r = btn.getBoundingClientRect();
            burst(r.left + r.width / 2, r.top + r.height / 2, C.c);
          }
          renderToday();
          runArcs($('todayCard'));
          runCounters($('todayCard'));
          try {
            await PluginAPI.updateTask(id, { isDone: toDone });
          } catch (err) {
            delete pending[id];
            renderToday();
            runArcs($('todayCard'));
            try {
              PluginAPI.showSnack({ msg: t('UPDATE_FAILED', { error: (err && err.message) || String(err) }), type: 'ERROR' });
            } catch (e2) {}
            return;
          }
          // dataChanged reloads the model; clear the pending flag once it has.
          setTimeout(function () {
            if (pending[id] === toDone) {
              delete pending[id];
              scheduleReload(true);
            }
          }, 1500);
        }

        // ---------- pace ----------
        function renderPace() {
          var p = cur;
          var html = '<div class="sec-head"><h2>' + esc(t('PACE_CARD')) + '</h2></div>';
          if (!p.dated) {
            $('paceCard').innerHTML = html + '<div class="empty">' + esc(t('PACE_NONE')) + '</div>';
            return;
          }
          var cls = p.pace > 0 ? 'good' : p.pace < 0 ? 'bad' : 'flat';
          var sign = p.pace > 0 ? '+' : p.pace < 0 ? '−' : '±';
          html += '<div class="pace-big"><div class="num ' + cls + '">' + sign + counter('pace', Math.abs(p.pace)) + '</div><div class="txt"><div>' + esc(paceLabel(p.pace, true)) + '</div><div>' + esc(t('PACE_HINT', { due: p.dueBefore, done: p.datedDone })) + '</div></div></div>';
          var expected = p.dueBefore / Math.max(1, p.total);
          html += '<div class="pace-track"><div class="fill" data-w="' + (p.ratio * 100).toFixed(2) + '%"></div><div class="mark" style="left:calc(' + (expected * 100).toFixed(2) + '% - 1px)" title="' + esc(t('PLAN_MARK')) + '"></div></div>';
          var shift = p.projectedEnd != null ? p.projectedEnd - p.planEnd : null;
          var shiftTxt = shift == null ? '' : shift > 0 ? t('DAYS_LATE', { n: shift }) : shift < 0 ? t('DAYS_EARLY', { n: -shift }) : t('ON_SCHEDULE');
          html += '<div class="pace-stats">';
          html += '<div class="bd-stat"><div class="l">' + esc(t('PLAN_END')) + '</div><div class="v">' + esc(fmtLong(p.planEnd)) + '</div></div>';
          html += '<div class="bd-stat"><div class="l">' + esc(t('PROJECTED')) + '</div><div class="v ' + (shift > 0 ? 'bad' : shift < 0 ? 'good' : '') + '">' + (p.projectedEnd != null ? esc(fmtLong(p.projectedEnd)) : '–') + '</div><div class="l2">' + esc(shiftTxt) + '</div></div>';
          html += '</div>';
          $('paceCard').innerHTML = html;
        }

        // ---------- tooltip ----------
        function showTip(html, x, y) {
          $tip.innerHTML = html;
          $tip.classList.add('on');
          var r = $tip.getBoundingClientRect();
          var left = Math.min(window.innerWidth - r.width - 8, Math.max(8, x - r.width / 2));
          var top = y - r.height - 12;
          if (top < 8) top = y + 18;
          $tip.style.left = left + 'px';
          $tip.style.top = top + 'px';
        }
        function hideTip() {
          $tip.classList.remove('on');
        }

        // ---------- confetti ----------
        var cv = $('confetti');
        var cx = cv.getContext('2d');
        var parts = [];
        var running = false;
        function burst(x, y, color, big) {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          var cols = [color || '#8b5cf6', '#22d3ee', '#f472b6', '#fbbf24', '#a78bfa'];
          var n = big ? 160 : 46;
          for (var i = 0; i < n; i++) {
            var a = Math.random() * Math.PI * 2;
            var sp = (big ? 5 : 2.5) + Math.random() * (big ? 9 : 5);
            parts.push({
              x: x,
              y: y,
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp - (big ? 6 : 3),
              s: 3 + Math.random() * 4,
              r: Math.random() * Math.PI,
              vr: (Math.random() - 0.5) * 0.4,
              c: cols[i % cols.length],
              life: 0,
              max: 55 + Math.random() * 45,
            });
          }
          if (!running) {
            running = true;
            requestAnimationFrame(tick);
          }
        }
        function tick() {
          var dpr = window.devicePixelRatio || 1;
          if (cv.width !== innerWidth * dpr) {
            cv.width = innerWidth * dpr;
            cv.height = innerHeight * dpr;
          }
          cx.setTransform(dpr, 0, 0, dpr, 0, 0);
          cx.clearRect(0, 0, innerWidth, innerHeight);
          parts = parts.filter(function (p) {
            return p.life < p.max;
          });
          parts.forEach(function (p) {
            p.life++;
            p.vy += 0.22;
            p.vx *= 0.985;
            p.x += p.vx;
            p.y += p.vy;
            p.r += p.vr;
            cx.save();
            cx.globalAlpha = Math.max(0, 1 - p.life / p.max);
            cx.translate(p.x, p.y);
            cx.rotate(p.r);
            cx.fillStyle = p.c;
            cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
            cx.restore();
          });
          if (parts.length) requestAnimationFrame(tick);
          else {
            running = false;
            cx.clearRect(0, 0, innerWidth, innerHeight);
          }
        }

        // ---------- data ----------
        var wasAllDone = null;
        async function load(force) {
          try {
            var todayStr = null;
            if (typeof PluginAPI.getDayContext === 'function') {
              try {
                var ctx = await PluginAPI.getDayContext();
                if (ctx) {
                  todayStr = ctx.todayStr;
                  dayOffsetMs = ctx.startOfNextDayDiffMs || 0;
                }
              } catch (e) {}
            }
            var res = await Promise.all([
              PluginAPI.getTasks(),
              PluginAPI.getArchivedTasks().catch(function () {
                return [];
              }),
              PluginAPI.getAllProjects(),
            ]);
            var next = L.buildModel({ tasks: res[0], archivedTasks: res[1], projects: res[2], todayStr: todayStr, dayOffsetMs: dayOffsetMs });
            var sig = JSON.stringify(next);
            $err.style.display = 'none';
            if (sig === lastSig && !force) return;
            lastSig = sig;
            // drop pending flags the store has caught up with
            Object.keys(pending).forEach(function (id) {
              var l = next.todayItems.concat(next.overdue).find(function (x) {
                return x.id === id;
              });
              if (!l || l.done === pending[id]) delete pending[id];
            });
            var selP = next.projects.find(function (x) {
              return x.id === (cur && cur.id);
            });
            var items = selP ? selP.todayItems : [];
            var allDone = items.length > 0 && items.every(function (l) {
              return l.done;
            });
            if (wasAllDone === false && allDone) {
              setTimeout(function () {
                burst(innerWidth / 2, innerHeight / 3, C ? C.c : '#8b5cf6', true);
              }, 250);
            }
            wasAllDone = allDone;
            model = next;
            render();
          } catch (e) {
            console.error('[Dashboard] load failed', e);
            $err.textContent = t('LOAD_ERROR', { error: e && e.message ? e.message : String(e) });
            $err.style.display = 'block';
          }
        }
        var reloadTimer = null;
        function scheduleReload(force) {
          clearTimeout(reloadTimer);
          reloadTimer = setTimeout(function () {
            load(force === true);
          }, 200);
        }

        // ---------- settings ----------
        var $startup = $('startup');
        async function loadSettings() {
          var s = { openOnStartup: true };
          try {
            var raw = await PluginAPI.loadPersistedData(SETTINGS_KEY);
            if (raw) Object.assign(s, JSON.parse(raw));
          } catch (e) {}
          $startup.checked = s.openOnStartup !== false;
        }
        $startup.addEventListener('change', function () {
          try {
            PluginAPI.persistDataSynced(JSON.stringify({ openOnStartup: $startup.checked }), SETTINGS_KEY);
          } catch (e) {}
        });

        // ---------- hooks ----------
        try {
          var H = PluginAPI.Hooks || {};
          PluginAPI.registerHook(H.DATA_CHANGED || 'dataChanged', scheduleReload);
          PluginAPI.registerHook(H.DAY_CHANGE || 'dayChange', function () {
            scheduleReload(true);
          });
          PluginAPI.registerHook(H.LANGUAGE_CHANGE || 'languageChange', function () {
            loadLanguage().then(function () {
              render();
            });
          });
        } catch (e) {
          console.warn('[Dashboard] registerHook failed', e);
        }
        var resizeTimer = null;
        var lastW = innerWidth;
        window.addEventListener('resize', function () {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function () {
            if (!model || innerWidth === lastW) return;
            lastW = innerWidth;
            if (!cur) return;
            renderBurndown();
            renderHeatmap();
          }, 150);
        });
        // The greeting depends on the hour; refresh it now and then.
        setInterval(function () {
          if (model && cur) {
            renderHero();
            runArcs($('hero'));
            runCounters($('hero'));
          }
        }, 10 * 60 * 1000);
        loadSettings();
        loadLanguage().then(function () {
          load(true);
        });
      })();
    </script>
  </body>
</html>
